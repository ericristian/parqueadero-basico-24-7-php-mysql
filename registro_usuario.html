<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Parqueadero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container form-page">
         <img src="img/logo parqueadero.png" alt="Logo Parqueadero" class="logo-registro">
        <h1>Registrarse</h1>
        <form id="registro-form">
            <div class="input-group">
                <label for="reg-username">Usuario:</label>
                <input type="text" id="reg-username" name="reg-username" placeholder="Elige un nombre de usuario" required>
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña:</label>
                <input type="password" id="reg-password" name="reg-password" placeholder="Crea una contraseña" required>
            </div>
            <div class="input-group">
                <label for="confirm-reg-password">Confirmar Contraseña:</label>
                <input type="password" id="confirm-reg-password" name="confirm-reg-password" placeholder="Confirma tu contraseña" required>
            </div>
            <button type="submit" class="btn primary-btn">Registrarse</button>
        </form>
        <a href="index.html" class="btn secondary-btn">Volver al Inicio de Sesión</a>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
