<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Parqueadero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container form-page">
         <img src="img/logo parqueadero.png" alt="Logo Parqueadero" class="logo-cambiar-contrasena">
        <h1>Cambiar Contraseña</h1>
        <form id="cambiar-contrasena-form">
            <div class="input-group">
                <label for="current-password">Contraseña Actual:</label>
                <input type="password" id="current-password" name="current-password" required>
            </div>
            <div class="input-group">
                <label for="new-password">Nueva Contraseña:</label>
                <input type="password" id="new-password" name="new-password" required>
            </div>
            <div class="input-group">
                <label for="confirm-new-password">Confirmar Nueva Contraseña:</label>
                <input type="password" id="confirm-new-password" name="confirm-new-password" required>
            </div>
            <button type="submit" class="btn primary-btn">Cambiar Contraseña</button>
        </form>
        <a href="dashboard.html" class="btn secondary-btn">Volver al Panel</a>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
