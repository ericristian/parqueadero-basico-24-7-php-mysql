<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software de parqueadero basico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <img src="img/logo parqueadero.png" alt="Logo Parqueadero" class="logo-login">

        <h1>Iniciar Sesión en el Parqueadero 24/7</h1>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn primary-btn">Ingresar</button>
            <div class="links">
                <a href="olvidaste_contrasena.html">¿Olvidaste tu contraseña?</a>
                <a href="registro.html">Registrarse</a>
                <a href="cambiar_contrasena.html">Cambiar Contraseña</a>
            </div>
        </form>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
