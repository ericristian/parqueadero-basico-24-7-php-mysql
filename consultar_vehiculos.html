<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Vehículos - Parqueadero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container form-page">
         <img src="img/logo parqueadero.png" alt="Logo Parqueadero" class="logo- consultar_vehiculos">
        <h1>Vehículos Actualmente en Parqueadero</h1>
        <div class="input-group">
            <label for="buscar_placa_consulta">Buscar por Placa:</label>
            <input type="text" id="buscar_placa_consulta" placeholder="Ingrese la placa">
            <button type="button" class="btn">Buscar</button>
        </div>

        <div class="vehicle-list">
            <div class="list-header">
                <span>Placa</span>
                <span>Tipo</span>
                <span>Entrada</span>
                <span>Ubicación</span>
            </div>
            <div class="vehicle-item">
                <span>ABC-123</span>
                <span>Carro</span>
                <span>2025-05-19 10:00</span>
                <span>A1</span>
            </div>
            <div class="vehicle-item">
                <span>XYZ-456</span>
                <span>Moto</span>
                <span>2025-05-19 11:30</span>
                <span>B3</span>
            </div>
            </div>
        <a href="dashboard.html" class="btn secondary-btn">Volver al Panel</a>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
